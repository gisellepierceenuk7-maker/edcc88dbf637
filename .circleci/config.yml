          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write snapshot
          command: |
            printf 'snap v1\n' > snap.txt
      - run:
          name: Build snapshot runner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SnapshotBless -j2
      - run:
          name: Bless snapshot
          command: LIONSS_LP=1 ./build/SnapshotBless --snap snap.txt --accept

